<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せどりスキャナー｜楽天 vs Amazon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --rakuten: #bf0000;
    --amazon: #ff9900;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --accent: #6c63ff;
    --green: #00e676;
    --red: #ff5252;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 7vw, 64px);
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--rakuten), #ff6b6b, var(--amazon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* タブ切替 */
  .mode-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .mode-tab {
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* 検索パネル */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    display: none;
  }

  .panel.active { display: block; }

  .panel-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  .search-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }

  .btn {
    background: linear-gradient(135deg, var(--rakuten), var(--amazon));
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    color: white;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* カテゴリグリッド */
  .genre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .genre-btn {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
    text-align: center;
  }

  .genre-btn:hover { border-color: var(--accent); color: var(--text); }
  .genre-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .scan-options {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .scan-options label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .scan-options select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
  }

  /* プログレス */
  .progress-wrap {
    display: none;
    margin-bottom: 20px;
  }

  .progress-wrap.active { display: block; }

  .progress-bar-bg {
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--rakuten), var(--amazon));
    border-radius: 4px;
    transition: width 0.3s;
    width: 0%;
  }

  .progress-text {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  /* サマリー */
  .summary-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .summary-bar.active { display: flex; }

  .summary-stat { text-align: center; }

  .summary-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
  }

  .summary-desc {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .summary-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
  }

  /* フィルター */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    display: none;
  }

  .filter-row.active { display: flex; }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--accent);
  }

  .sort-select {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    padding: 5px 12px;
    cursor: pointer;
    outline: none;
  }

  /* 商品カード */
  .results { display: flex; flex-direction: column; gap: 12px; }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    animation: fadeUp 0.3s ease both;
  }

  .item-card:hover {
    border-color: rgba(108,99,255,0.4);
    transform: translateY(-2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .item-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--text-dim);
    min-width: 28px;
    line-height: 1;
    padding-top: 2px;
  }

  .item-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-prices {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .price-col {
    padding: 12px 16px;
    position: relative;
  }

  .price-col:first-child { border-right: 1px solid var(--border); }
  .price-col.cheaper { background: rgba(0,230,118,0.04); }

  .price-platform {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .price-platform.rakuten { color: #ff6b6b; }
  .price-platform.amazon { color: var(--amazon); }

  .price-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
  }

  .price-amount.na { font-size: 14px; color: var(--text-dim); }

  .cheaper-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(0,230,118,0.15);
    border: 1px solid rgba(0,230,118,0.3);
    color: var(--green);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 4px;
  }

  .diff-bar {
    padding: 8px 16px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    border-top: 1px solid var(--border);
  }

  .diff-label { color: var(--text-dim); }

  .diff-value {
    font-weight: 700;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .diff-value.rakuten-cheaper { color: #ff6b6b; }
  .diff-value.amazon-cheaper { color: var(--amazon); }

  .profit-badge {
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .profit-high { background: rgba(0,230,118,0.2); color: var(--green); }
  .profit-mid { background: rgba(255,153,0,0.2); color: var(--amazon); }
  .profit-low { background: rgba(255,255,255,0.05); color: var(--text-dim); }

  .item-links {
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  .item-link {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .item-link:hover { opacity: 0.8; }

  .item-link.rakuten {
    background: rgba(191,0,0,0.15);
    color: #ff6b6b;
    border: 1px solid rgba(191,0,0,0.3);
  }

  .item-link.amazon {
    background: rgba(255,153,0,0.12);
    color: var(--amazon);
    border: 1px solid rgba(255,153,0,0.3);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    display: none;
  }

  .empty.active { display: block; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  .error-box {
    background: rgba(255,82,82,0.1);
    border: 1px solid rgba(255,82,82,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: #ff8a80;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }

  .error-box.active { display: block; }

  .footer-note {
    text-align: center;
    margin-top: 40px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.8;
  }

  @media (max-width: 500px) {
    .search-row { flex-direction: column; }
    .item-prices { grid-template-columns: 1fr; }
    .price-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    .mode-tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">SEDORI SCANNER</div>
    <div class="tagline">楽天市場 vs Amazon — 価格差スキャン for せどり</div>
  </header>

  <!-- モード切替 -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('keyword', this)">🔍 キーワード検索</button>
    <button class="mode-tab" onclick="setMode('scan', this)">📡 カテゴリスキャン</button>
  </div>

  <!-- キーワード検索パネル -->
  <div class="panel active" id="panelKeyword">
    <div class="panel-title">商品名・キーワードで検索</div>
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="例：ソニー WH-1000XM5、ルンバ、任天堂..." />
      <button class="btn" id="searchBtn" onclick="doKeywordSearch()">検索</button>
    </div>
  </div>

  <!-- カテゴリスキャンパネル -->
  <div class="panel" id="panelScan">
    <div class="panel-title">カテゴリを選んで価格差が大きい商品を自動スキャン</div>
    <div class="genre-grid">
      <button class="genre-btn active" data-genre="家電" onclick="selectGenre(this)">🏠 家電</button>
      <button class="genre-btn" data-genre="TV・オーディオ・カメラ" onclick="selectGenre(this)">📺 TV・カメラ</button>
      <button class="genre-btn" data-genre="パソコン・周辺機器" onclick="selectGenre(this)">💻 PC・周辺機器</button>
      <button class="genre-btn" data-genre="スマートフォン・タブレット" onclick="selectGenre(this)">📱 スマホ・タブレット</button>
      <button class="genre-btn" data-genre="ゲーム" onclick="selectGenre(this)">🎮 ゲーム</button>
      <button class="genre-btn" data-genre="おもちゃ" onclick="selectGenre(this)">🧸 おもちゃ</button>
      <button class="genre-btn" data-genre="ドラッグストア・ビューティー" onclick="selectGenre(this)">💄 ドラッグ・美容</button>
      <button class="genre-btn" data-genre="ホーム・キッチン" onclick="selectGenre(this)">🍳 ホーム・キッチン</button>
      <button class="genre-btn" data-genre="日用品雑貨" onclick="selectGenre(this)">🧴 日用品雑貨</button>
    </div>
    <div class="scan-options">
      <label>スキャンページ数：</label>
      <select id="scanPages">
        <option value="1">1ページ（30件）</option>
        <option value="2" selected>2ページ（60件）</option>
        <option value="3">3ページ（90件）</option>
      </select>
      <label>最小価格差：</label>
      <select id="minDiff">
        <option value="0">制限なし</option>
        <option value="500">500円以上</option>
        <option value="1000" selected>1,000円以上</option>
        <option value="3000">3,000円以上</option>
        <option value="5000">5,000円以上</option>
      </select>
      <button class="btn" id="scanBtn" onclick="doScan()">📡 スキャン開始</button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <!-- プログレスバー -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">スキャン中...</div>
  </div>

  <!-- サマリー -->
  <div class="summary-bar" id="summaryBar">
    <div class="summary-stat">
      <div class="summary-num" id="totalCount">0</div>
      <div class="summary-desc">スキャン件数</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num" id="diffCount">0</div>
      <div class="summary-desc">価格差あり</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num" id="rakutenWins">0</div>
      <div class="summary-desc">楽天が安い</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num" id="maxDiff">¥0</div>
      <div class="summary-desc">最大価格差</div>
    </div>
  </div>

  <!-- フィルター -->
  <div class="filter-row" id="filterRow">
    <button class="filter-btn" onclick="setFilter('all', this)">すべて</button>
    <button class="filter-btn active" onclick="setFilter('rakuten', this)">楽天が安い</button>
    <button class="filter-btn" onclick="setFilter('amazon', this)">Amazonが安い</button>
    <select class="sort-select" onchange="setSort(this.value)">
      <option value="diff_desc">価格差が大きい順</option>
      <option value="diff_asc">価格差が小さい順</option>
      <option value="pct_desc">割引率が高い順</option>
      <option value="rakuten_asc">楽天価格が安い順</option>
    </select>
  </div>

  <div class="results" id="results"></div>
  <div class="empty" id="empty">
    <div class="empty-icon">🔍</div>
    <div class="empty-text">価格差のある商品が見つかりませんでした</div>
  </div>

  <div class="footer-note">
    楽天市場: Rakuten商品検索API ／ Amazon: Keepa API<br>
    価格は取得時点のものです。実際の価格はサイトでご確認ください。
  </div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbykNeHKDWo2dCBqy9l_ncsUoQVSUEcikfEwK6-Pvh8kEx18ZhkvwGAaCMG8xBT1WWrW2Q/exec';

let allItems = [];
let currentFilter = 'rakuten';
let currentSort = 'diff_desc';
let currentMode = 'keyword';
let selectedGenre = '家電';
let scanning = false;

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doKeywordSearch();
});

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panelKeyword').classList.toggle('active', mode === 'keyword');
  document.getElementById('panelScan').classList.toggle('active', mode === 'scan');
}

function selectGenre(btn) {
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedGenre = btn.dataset.genre;
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderItems();
}

function setSort(val) {
  currentSort = val;
  renderItems();
}

// キーワード検索
async function doKeywordSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) return;

  resetUI();
  document.getElementById('searchBtn').disabled = true;
  setProgress(true, 0, '楽天市場を検索中...');

  try {
    const rItems = await fetchRakuten(keyword);
    setProgress(true, 30, `${rItems.length}件取得。Amazon価格を照合中...`);

    const merged = await mergeWithAmazon(rItems, (i, total) => {
      setProgress(true, 30 + Math.round((i / total) * 70), `Amazon価格照合中... ${i}/${total}`);
    });

    allItems = merged;
    finishScan();
  } catch(e) {
    setError('エラー: ' + e.message);
  } finally {
    setProgress(false);
    document.getElementById('searchBtn').disabled = false;
  }
}

// カテゴリスキャン
async function doScan() {
  if (scanning) return;
  scanning = true;

  resetUI();
  document.getElementById('scanBtn').disabled = true;
  const pages = parseInt(document.getElementById('scanPages').value);
  const minDiff = parseInt(document.getElementById('minDiff').value);

  let allRakuten = [];

  try {
    for (let p = 1; p <= pages; p++) {
      setProgress(true, Math.round((p - 1) / pages * 30), `楽天ランキング取得中... ${p}/${pages}ページ`);
      const items = await fetchRanking(selectedGenre, p);
      allRakuten = allRakuten.concat(items);
      await sleep(500);
    }

    setProgress(true, 30, `${allRakuten.length}件取得。Amazon価格を照合中...`);

    const merged = await mergeWithAmazon(allRakuten, (i, total) => {
      setProgress(true, 30 + Math.round((i / total) * 70), `Amazon価格照合中... ${i}/${total}`);
    });

    // 最小価格差フィルター
    allItems = minDiff > 0
      ? merged.filter(m => m.rakutenPrice && m.amazonPrice && Math.abs(m.rakutenPrice - m.amazonPrice) >= minDiff)
      : merged;

    finishScan();
  } catch(e) {
    setError('エラー: ' + e.message);
  } finally {
    setProgress(false);
    document.getElementById('scanBtn').disabled = false;
    scanning = false;
  }
}

async function fetchRakuten(keyword) {
  const url = `${GAS_URL}?type=rakuten&keyword=${encodeURIComponent(keyword)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.status !== 200) throw new Error('楽天API: ' + JSON.stringify(json.body));
  const data = json.body;
  return (data.Items || []).map(item => ({
    rank: null,
    name: item.itemName,
    rakutenPrice: item.itemPrice,
    rakutenUrl: item.itemUrl,
    janCode: item.janCode || null,
    modelNumber: item.modelNumber || null
  }));
}

async function fetchRanking(genre, page) {
  const url = `${GAS_URL}?type=ranking&genre=${encodeURIComponent(genre)}&page=${page}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.status !== 200) throw new Error('ランキングAPI: ' + JSON.stringify(json.body));
  const data = json.body;
  return (data.Items || []).map((item, i) => ({
    rank: ((page - 1) * 30) + i + 1,
    name: item.itemName,
    rakutenPrice: item.itemPrice,
    rakutenUrl: item.itemUrl,
    janCode: item.janCode || null,
    modelNumber: item.modelNumber || null
  }));
}

async function mergeWithAmazon(rItems, onProgress) {
  const merged = [];
  for (let i = 0; i < rItems.length; i++) {
    const r = rItems[i];
    onProgress(i + 1, rItems.length);

    let amazonPrice = null;
    let amazonUrl = null;

    const searchTerm = r.janCode || r.modelNumber;
    if (searchTerm) {
      const keepaResult = await fetchKeepaByTerm(searchTerm);
      if (keepaResult) {
        amazonPrice = keepaResult.amazonPrice;
        amazonUrl = keepaResult.amazonUrl;
      }
    }

    merged.push({
      rank: r.rank,
      name: r.name,
      rakutenPrice: r.rakutenPrice,
      rakutenUrl: r.rakutenUrl,
      amazonPrice: amazonPrice,
      amazonUrl: amazonUrl
    });

    await sleep(200);
  }
  return merged;
}

async function fetchKeepaByTerm(term) {
  const url = `${GAS_URL}?type=keepa_ean&ean=${encodeURIComponent(term)}`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const json = await res.json();
  if (!json.products || json.products.length === 0) return null;
  const p = json.products[0];
  return p.amazonPrice ? p : null;
}

function finishScan() {
  updateSummary();
  renderItems();
  document.getElementById('summaryBar').classList.add('active');
  document.getElementById('filterRow').classList.add('active');
  if (allItems.length === 0) {
    document.getElementById('empty').classList.add('active');
  }
}

function updateSummary() {
  const withBoth = allItems.filter(i => i.rakutenPrice && i.amazonPrice);
  const rakutenWins = withBoth.filter(i => i.rakutenPrice < i.amazonPrice);
  const maxDiff = withBoth.length > 0
    ? Math.max(...withBoth.map(i => Math.abs(i.rakutenPrice - i.amazonPrice)))
    : 0;

  document.getElementById('totalCount').textContent = allItems.length;
  document.getElementById('diffCount').textContent = withBoth.length;
  document.getElementById('rakutenWins').textContent = rakutenWins.length;
  document.getElementById('maxDiff').textContent = '¥' + maxDiff.toLocaleString();
}

function renderItems() {
  const container = document.getElementById('results');
  container.innerHTML = '';
  document.getElementById('empty').classList.remove('active');

  let items = [...allItems];

  if (currentFilter === 'rakuten') {
    items = items.filter(i => i.rakutenPrice && i.amazonPrice && i.rakutenPrice < i.amazonPrice);
  } else if (currentFilter === 'amazon') {
    items = items.filter(i => i.rakutenPrice && i.amazonPrice && i.amazonPrice < i.rakutenPrice);
  } else {
    items = items.filter(i => i.rakutenPrice && i.amazonPrice);
  }

  items.sort((a, b) => {
    const diffA = Math.abs((a.rakutenPrice || 0) - (a.amazonPrice || 0));
    const diffB = Math.abs((b.rakutenPrice || 0) - (b.amazonPrice || 0));
    const pctA = a.amazonPrice ? diffA / a.amazonPrice : 0;
    const pctB = b.amazonPrice ? diffB / b.amazonPrice : 0;
    if (currentSort === 'diff_desc') return diffB - diffA;
    if (currentSort === 'diff_asc') return diffA - diffB;
    if (currentSort === 'pct_desc') return pctB - pctA;
    if (currentSort === 'rakuten_asc') return (a.rakutenPrice || 999999) - (b.rakutenPrice || 999999);
    return 0;
  });

  if (items.length === 0) {
    document.getElementById('empty').classList.add('active');
    return;
  }

  items.forEach((item, idx) => {
    container.appendChild(buildCard(item, idx));
  });
}

function buildCard(item, index) {
  const card = document.createElement('div');
  card.className = 'item-card';
  card.style.animationDelay = (index * 0.03) + 's';

  const hasBoth = item.rakutenPrice && item.amazonPrice;
  const rakutenCheaper = hasBoth && item.rakutenPrice < item.amazonPrice;
  const amazonCheaper = hasBoth && item.amazonPrice < item.rakutenPrice;
  const diff = hasBoth ? Math.abs(item.rakutenPrice - item.amazonPrice) : 0;
  const diffPct = hasBoth && item.amazonPrice > 0 ? Math.round((diff / item.amazonPrice) * 100) : 0;

  let profitClass = 'profit-low';
  let profitLabel = '差額小';
  if (diff >= 5000) { profitClass = 'profit-high'; profitLabel = '高利益'; }
  else if (diff >= 1000) { profitClass = 'profit-mid'; profitLabel = '中利益'; }

  const shortName = item.name.length > 80 ? item.name.slice(0, 80) + '…' : item.name;

  card.innerHTML = `
    <div class="item-header">
      ${item.rank ? `<div class="item-rank">#${item.rank}</div>` : ''}
      <div class="item-title">${escHtml(shortName)}</div>
      ${diff > 0 ? `<div class="profit-badge ${profitClass}">${profitLabel}</div>` : ''}
    </div>
    <div class="item-prices">
      <div class="price-col ${rakutenCheaper ? 'cheaper' : ''}">
        <div class="price-platform rakuten">楽天市場</div>
        ${item.rakutenPrice
          ? `<div class="price-amount">¥${item.rakutenPrice.toLocaleString()}</div>
             ${rakutenCheaper ? '<div class="cheaper-badge">✓ 安い</div>' : ''}`
          : '<div class="price-amount na">取得不可</div>'
        }
      </div>
      <div class="price-col ${amazonCheaper ? 'cheaper' : ''}">
        <div class="price-platform amazon">Amazon</div>
        ${item.amazonPrice
          ? `<div class="price-amount">¥${item.amazonPrice.toLocaleString()}</div>
             ${amazonCheaper ? '<div class="cheaper-badge">✓ 安い</div>' : ''}`
          : '<div class="price-amount na">取得不可</div>'
        }
      </div>
    </div>
    ${hasBoth && diff > 0 ? `
    <div class="diff-bar">
      <span class="diff-label">価格差</span>
      <span class="diff-value ${rakutenCheaper ? 'rakuten-cheaper' : 'amazon-cheaper'}">
        ¥${diff.toLocaleString()} (${diffPct}%差)
      </span>
    </div>` : ''}
    <div class="item-links">
      ${item.rakutenUrl ? `<a href="${item.rakutenUrl}" target="_blank" class="item-link rakuten">楽天で見る →</a>` : ''}
      ${item.amazonUrl ? `<a href="${item.amazonUrl}" target="_blank" class="item-link amazon">Amazonで見る →</a>` : ''}
    </div>
  `;
  return card;
}

function resetUI() {
  allItems = [];
  document.getElementById('results').innerHTML = '';
  document.getElementById('empty').classList.remove('active');
  document.getElementById('summaryBar').classList.remove('active');
  document.getElementById('filterRow').classList.remove('active');
  setError('');
}

function setProgress(active, pct, text) {
  const wrap = document.getElementById('progressWrap');
  wrap.classList.toggle('active', active);
  if (active) {
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = text || '';
  }
}

function setError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.toggle('active', !!msg);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
